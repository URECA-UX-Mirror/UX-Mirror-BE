name: 백엔드 테스트

on:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 테스트 의존성 설치
        # 모델(transformers·torch)은 테스트에서 쓰지 않는다. pillow는 vendor 요청 파서, playwright는 쇼핑몰·브라우저 테스트용
        run: |
          python -m pip install fastapi uvicorn httpx pytest python-dotenv requests pillow playwright
          python -m playwright install --with-deps chromium
      - name: pytest
        run: python -m pytest -q tests
